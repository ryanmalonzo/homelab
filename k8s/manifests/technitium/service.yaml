apiVersion: v1
kind: Service
metadata:
  name: technitium-web
spec:
  type: ClusterIP
  selector:
    app: technitium
  ports:
    - name: web
      port: 5380
      targetPort: 5380
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: technitium-dns
spec:
  type: LoadBalancer
  selector:
    app: technitium
  ports:
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
